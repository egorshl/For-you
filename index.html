<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:linear-gradient(145deg,#fff7f3,#fde7e1);color:#402b2b;overflow:hidden}
.screen{
 position:absolute;inset:0;display:grid;place-items:center;padding:24px;
 transition:opacity .55s ease,transform .55s ease;
}
.card{
 width:min(90vw,560px);padding:38px 25px;border-radius:30px;
 background:rgba(255,255,255,.78);
 box-shadow:0 18px 60px rgba(104,58,58,.14);
 text-align:center;
}
h1{margin:0 0 28px;font-size:clamp(30px,8vw,48px)}
p{font-size:clamp(17px,4.6vw,22px);line-height:1.55;margin:12px 0}
.buttons{display:flex;gap:14px;justify-content:center;margin-top:26px}
.btn{
 display:inline-block;text-decoration:none;border:0;border-radius:18px;
 padding:15px 25px;font-size:19px;font-weight:700;font-family:inherit;
}
.yes{background:#c96f73;color:#fff;box-shadow:0 8px 22px rgba(201,111,115,.3)}
.no{background:#eee5e3;color:#806c6c}
.big{margin-top:18px;font-weight:700;color:#c96f73;font-size:clamp(20px,5.2vw,26px)}
.heart{display:inline-block;animation:beat 1.25s ease-in-out infinite}
#love{opacity:0;transform:scale(1.03);pointer-events:none}
#love:target{opacity:1;transform:scale(1);pointer-events:auto}
#love:target ~ #question{opacity:0;transform:scale(.98);pointer-events:none}
.float{position:absolute;bottom:-35px;font-size:22px;animation:up linear infinite;opacity:0}
.f1{left:12%;animation-duration:8s}.f2{left:30%;animation-duration:11s;animation-delay:2s}
.f3{left:68%;animation-duration:9s;animation-delay:1s}.f4{left:85%;animation-duration:12s;animation-delay:3s}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes up{10%{opacity:.7}100%{transform:translateY(-115vh) rotate(20deg);opacity:0}}
</style>
</head>
<body>
<span class="float f1">❤️</span><span class="float f2">🤍</span><span class="float f3">💗</span><span class="float f4">❤️</span>

<section id="love" class="screen">
 <main class="card">
  <h1>Для тебя <span class="heart">❤️</span></h1>
  <p>Я просто хотел напомнить тебе одну важную вещь.</p>
  <p>Я очень тебя люблю.</p>
  <p>И очень по тебе соскучился.</p>
  <p>Мне не хватает твоего голоса, твоей улыбки и просто тебя рядом.</p>
  <p class="big">Скорее бы тебя обнять ❤️</p>
 </main>
</section>

<section id="question" class="screen">
 <div class="card">
  <h1>Ты скучаешь по мне? 🥺</h1>
  <div class="buttons">
   <a class="btn yes" href="#love">Да🥹</a>
   <span class="btn no">Нет😔</span>
  </div>
 </div>
</section>
</body>
</html>
